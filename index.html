<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support desk quotes</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Support desk quotes</h1>
        <p id="subtitle" class="muted">Waiting for quotes from the host.</p>
      </header>

      <fieldset class="reqs">
        <legend>Must have</legend>
        <label class="switch"><input type="checkbox" role="switch" value="euData" /> EU data residency</label>
        <label class="switch"><input type="checkbox" role="switch" value="soc2" /> SOC 2</label>
        <span id="match-count" class="muted" aria-live="polite"></span>
      </fieldset>

      <fieldset id="cards" class="cards">
        <legend class="sr-only">Vendor</legend>
      </fieldset>

      <div class="actions">
        <button id="draft" type="button" disabled>Draft decision</button>
        <p id="status" role="status" class="muted">Pick a vendor that meets the requirements.</p>
      </div>
    </main>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
